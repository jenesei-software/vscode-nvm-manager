name: Bug report
description: Report a problem with NVM Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: NVM Manager version
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: nvm-version
    attributes:
      label: nvm version
      description: Output of `nvm version` (nvm-windows) or `nvm --version` (nvm-sh).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output log
      description: Copy the "NVM Manager" output channel contents if relevant.
    validations:
      required: false
